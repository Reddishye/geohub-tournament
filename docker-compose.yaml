version: "3.9"
services:
  geohub:
    image: ghcr.io/benlikescode/geohub:main
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017
      REDIS_URL: redis://redis:6379
    volumes:
      - .env:/usr/src/app/.env
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - mongo
      - redis
  mongo:
    image: mongo:7
    restart: always
    command: ["--replSet", "rs0"]
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  mongo_data:
  redis_data:
